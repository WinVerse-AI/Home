name: Generate local translations

on:
  push:
    branches: ["diagnostic-pages"]
    paths:
      - ".github/workflows/generate-local-translations.yml"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline translation engine
        run: pip install --disable-pip-version-check argostranslate
      - name: Generate dictionaries
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from argostranslate import package, translate

          source = json.loads(Path('translation-source.json').read_text(encoding='utf-8'))
          strings = []
          seen = set()
          for item in source['unique']:
              text = item['text'].strip()
              if text and text not in seen:
                  seen.add(text)
                  strings.append(text)

          targets = {
              'zh-CN': 'zh',
              'ja': 'ja',
              'fr': 'fr',
              'de': 'de',
              'es': 'es',
          }
          protected = [
              'WinVerse™', 'SerotoniX™', 'UHN', 'KITE', 'NMES', 'fNMES', 'EEG',
              'Alessa Yang', 'Zen KOH', 'Professor Milos R. Popovic', 'Milos R. Popovic',
              'Shanghai', 'Toronto', 'Singapore', 'LinkedIn', 'US$', 'CAD', 'FDA', 'CE'
          ]

          def protect(text):
              values = {}
              out = text
              for index, token in enumerate(sorted(protected, key=len, reverse=True)):
                  if token in out:
                      marker = f'ZXQ{index}QXZ'
                      out = out.replace(token, marker)
                      values[marker] = token
              return out, values

          def restore(text, values):
              out = text
              for marker, token in values.items():
                  out = out.replace(marker, token)
                  out = out.replace(marker.lower(), token)
              return out

          def should_copy(text):
              stripped = text.strip()
              if not stripped:
                  return True
              if re.fullmatch(r'[\d\W_]+', stripped, flags=re.UNICODE):
                  return True
              if stripped in protected:
                  return True
              return False

          package.update_package_index()
          available = package.get_available_packages()
          out_dir = Path('translations/generated')
          out_dir.mkdir(parents=True, exist_ok=True)
          report = {}

          for locale, target in targets.items():
              matches = [p for p in available if p.from_code == 'en' and p.to_code == target]
              if not matches:
                  raise SystemExit(f'No Argos package for en -> {target}')
              model_path = matches[0].download()
              package.install_from_path(model_path)
              mapping = {}
              failures = []
              for position, text in enumerate(strings, 1):
                  if should_copy(text):
                      mapping[text] = text
                      continue
                  prepared, values = protect(text)
                  try:
                      translated = translate.translate(prepared, 'en', target).strip()
                      mapping[text] = restore(translated, values) or text
                  except Exception as exc:
                      mapping[text] = text
                      failures.append({'text': text, 'error': str(exc)})
                  if position % 50 == 0:
                      print(locale, position, '/', len(strings), flush=True)
              payload = {
                  'locale': locale,
                  'source': 'en',
                  'generated_by': 'Argos Translate; reviewed terminology remains required',
                  'strings': mapping,
              }
              (out_dir / f'{locale}.json').write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              report[locale] = {'strings': len(mapping), 'failures': failures[:20], 'failure_count': len(failures)}

          Path('translations/generated/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
      - name: Commit generated dictionaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/generated
          git commit -m "Generate local site translation dictionaries" || true
          git push origin HEAD:diagnostic-pages
