name: Inspect repair validation

on:
  push:
    branches: ["diagnostic-validation-status"]
    paths:
      - ".github/workflows/inspect-repair-validation.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const selected = runs
              .filter(run => run.name === 'Validate translation repair branch')
              .slice(0, 5);
            const output = [];
            for (const run of selected) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 }
              );
              output.push({
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                html_url: run.html_url,
                jobs: jobs.map(job => ({
                  id: job.id,
                  name: job.name,
                  status: job.status,
                  conclusion: job.conclusion,
                  steps: (job.steps || []).map(step => ({name: step.name, status: step.status, conclusion: step.conclusion}))
                }))
              });
            }
            require('fs').writeFileSync('repair-validation-diagnostic.json', JSON.stringify(output, null, 2));
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-validation-diagnostic.json
          git commit -m "Capture repair validation status" || true
          git push origin HEAD:diagnostic-validation-status
