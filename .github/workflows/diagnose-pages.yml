name: Diagnose Pages workflow

on:
  push:
    branches: ["diagnostic-pages"]
    paths:
      - ".github/workflows/diagnose-pages.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'pages.yml',
              branch: 'main',
              per_page: 3
            });
            const output = [];
            for (const run of runs.data.workflow_runs) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                per_page: 20
              });
              output.push({
                id: run.id,
                head_sha: run.head_sha,
                status: run.status,
                conclusion: run.conclusion,
                html_url: run.html_url,
                jobs: jobs.data.jobs.map((job) => ({
                  id: job.id,
                  name: job.name,
                  status: job.status,
                  conclusion: job.conclusion,
                  steps: job.steps?.map((step) => ({
                    name: step.name,
                    status: step.status,
                    conclusion: step.conclusion
                  })) || []
                }))
              });
            }
            require('fs').writeFileSync(
              'pages-diagnostics.json',
              JSON.stringify({ captured_at: new Date().toISOString(), pages_runs: output }, null, 2)
            );
      - name: Commit diagnostic result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages-diagnostics.json
          git commit -m "Capture current Pages deployment" || exit 0
          git push
