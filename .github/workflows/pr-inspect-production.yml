name: Read production deployment state

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/pr-inspect-production.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const selected = runs
              .filter(run => run.name === 'Validate and deploy Pages')
              .slice(0, 8);
            for (const run of selected) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 }
              );
              core.info('PRODUCTION_RUN ' + JSON.stringify({
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                event: run.event,
                html_url: run.html_url,
                created_at: run.created_at,
                updated_at: run.updated_at,
                jobs: jobs.map(job => ({
                  id: job.id,
                  name: job.name,
                  status: job.status,
                  conclusion: job.conclusion,
                  steps: (job.steps || []).map(step => ({
                    name: step.name,
                    status: step.status,
                    conclusion: step.conclusion
                  }))
                }))
              }));
            }
      - name: Check public assets
        run: |
          set +e
          base="https://winverse-ai.github.io/Home/"
          for asset in version.json index.html language.js translations/generated/zh-CN.json translations/generated/fr.json; do
            echo "PUBLIC_ASSET $asset"
            curl -L -sS --max-time 20 -o "/tmp/${asset//\//_}" -w 'HTTP %{http_code}\n' "${base}${asset}?inspect=${GITHUB_RUN_ID}"
          done
          echo 'PUBLIC_VERSION_BEGIN'
          cat /tmp/version.json 2>/dev/null || true
          echo 'PUBLIC_VERSION_END'
          echo "INDEX_VERSIONED_LANGUAGE $(grep -c 'language.js?v=local-translation-v1' /tmp/index.html 2>/dev/null || true)"
          echo "LANGUAGE_LOCAL_DICTIONARY $(grep -c 'translations/generated' /tmp/language.js 2>/dev/null || true)"
          echo "LANGUAGE_GOOGLE_LOADER $(grep -Ec 'translate\.google\.com|TranslateElement|goog-te-combo' /tmp/language.js 2>/dev/null || true)"
