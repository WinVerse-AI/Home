name: Read production deployment state

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/pr-inspect-production.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query production workflow through GitHub REST
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${auth[@]}" "${api}/actions/runs?per_page=100" -o /tmp/runs.json
          jq -c '.workflow_runs[] | select(.name == "Validate and deploy Pages") | {id,status,conclusion,head_sha,event,html_url,created_at,updated_at}' /tmp/runs.json | head -8 | while read -r run; do
            id="$(jq -r '.id' <<<"$run")"
            curl -fsSL "${auth[@]}" "${api}/actions/runs/${id}/jobs?per_page=100" -o "/tmp/jobs-${id}.json"
            jobs="$(jq -c '[.jobs[] | {id,name,status,conclusion,steps:[.steps[]? | {name,status,conclusion}]}]' "/tmp/jobs-${id}.json")"
            echo "PRODUCTION_RUN $(jq -c --argjson jobs "$jobs" '. + {jobs:$jobs}' <<<"$run")"
          done

      - name: Check public assets
        shell: bash
        run: |
          set +e
          base="https://winverse-ai.github.io/Home/"
          for asset in version.json index.html language.js translations/generated/zh-CN.json translations/generated/fr.json; do
            echo "PUBLIC_ASSET $asset"
            curl -L -sS --max-time 20 -o "/tmp/${asset//\//_}" -w 'HTTP %{http_code}\n' "${base}${asset}?inspect=${GITHUB_RUN_ID}"
          done
          echo 'PUBLIC_VERSION_BEGIN'
          cat /tmp/version.json 2>/dev/null || true
          echo 'PUBLIC_VERSION_END'
          echo "INDEX_VERSIONED_LANGUAGE $(grep -c 'language.js?v=local-translation-v1' /tmp/index.html 2>/dev/null || true)"
          echo "LANGUAGE_LOCAL_DICTIONARY $(grep -c 'translations/generated' /tmp/language.js 2>/dev/null || true)"
          echo "LANGUAGE_GOOGLE_LOADER $(grep -Ec 'translate\.google\.com|TranslateElement|goog-te-combo' /tmp/language.js 2>/dev/null || true)"
