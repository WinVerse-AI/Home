name: Inspect production deployment

on:
  push:
    branches: ["diagnostic-validation-status"]
    paths:
      - ".github/workflows/inspect-production-deploy.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const selected = runs
              .filter(run => run.name === 'Validate and deploy Pages')
              .slice(0, 5);
            const output = [];
            for (const run of selected) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 }
              );
              output.push({
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                html_url: run.html_url,
                created_at: run.created_at,
                updated_at: run.updated_at,
                jobs: jobs.map(job => ({
                  id: job.id,
                  name: job.name,
                  status: job.status,
                  conclusion: job.conclusion,
                  steps: (job.steps || []).map(step => ({name: step.name, status: step.status, conclusion: step.conclusion}))
                }))
              });
            }
            require('fs').writeFileSync('production-deployment-diagnostic.json', JSON.stringify(output, null, 2));
      - name: Capture live production assets
        run: |
          set -euo pipefail
          base="https://winverse-ai.github.io/Home/"
          mkdir -p /tmp/live
          for asset in version.json index.html language.js translations/generated/zh-CN.json translations/generated/fr.json; do
            safe="${asset//\//_}"
            code="$(curl -L -sS -o "/tmp/live/${safe}" -w '%{http_code}' "${base}${asset}?inspect=${GITHUB_RUN_ID}" || true)"
            printf '%s %s\n' "$asset" "$code" >> /tmp/live/http-status.txt
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/live')
          def read(name):
              path=root/name
              return path.read_text(encoding='utf-8', errors='replace') if path.exists() else None
          version=read('version.json')
          language=read('language.js') or ''
          index=read('index.html') or ''
          result={
              'http': read('http-status.txt'),
              'version': version,
              'index_has_versioned_language': 'language.js?v=local-translation-v1' in index,
              'language_has_local_dictionary': 'translations/generated' in language,
              'language_has_google_loader': 'translate.google.com' in language or 'TranslateElement' in language,
          }
          Path('live-production-diagnostic.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-deployment-diagnostic.json live-production-diagnostic.json
          git commit -m "Capture production deployment state" || true
          git pull --rebase origin diagnostic-validation-status
          git push origin HEAD:diagnostic-validation-status
