name: Repair SerotoniX image references

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-serotonix-index
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace invalid historical image references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_commit = "188646086300cad638d26fbfacde9b1b911b4cc5"
          base = f"https://raw.githubusercontent.com/WinVerse-AI/Homepage/{source_commit}/assets"
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-layered-architecture-2026.webp": f"{base}/serotonix-concept-exploded-hires.webp",
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-controller-pcba-2026.webp": f"{base}/serotonix-controller-pcba-2026.webp",
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-product-cad-2026.webp": f"{base}/serotonix-mask-hero-2026.webp",
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-product-dimensions-2026.webp": f"{base}/serotonix-proposed-specifications-hires.webp",
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-system-control-2026.webp": f"{base}/serotonix-system-schematic-hires.webp",
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-system-architecture-2026.webp": f"{base}/serotonix-proposed-specifications-hires.webp",
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-colour-finish-2026.webp": f"{base}/serotonix-colour-finish-2026.webp",
              "https://raw.githubusercontent.com/WinVerse-AI/Homepage/188646086300cad638d26fbfacde9b1b911b4cc5/assets/serotonix-colour-finish-2026.webp": f"{base}/serotonix-colour-finish-2026.webp",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if "841cb4697679edec2a83b9a21f74caa6ada787d9" in text:
              raise SystemExit("An invalid historical asset reference remains")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit repair
        run: |
          if git diff --quiet -- index.html; then
            echo "Index already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair SerotoniX image references"
          git push origin HEAD:main
