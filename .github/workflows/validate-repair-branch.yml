name: Validate translation repair branch

on:
  push:
    branches: ["agent/local-translations-no-google"]
    paths:
      - ".github/workflows/validate-repair-branch.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/local-translations-no-google
      - name: Validate complete local multilingual build
        run: |
          set -euo pipefail
          test ! -e translate-cleanup.js
          test ! -e translate-cleanup.css
          node --check language.js
          node --check script.js
          python3 -m py_compile build_site.py
          python3 build_site.py
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('dist')
          pages = (
              'index.html','overview.html','platform.html','development.html',
              'evidence.html','market.html','about.html','contact.html',
              'commercial-beachhead.html','differentiation.html','expansion-engine.html',
          )
          expected_nav = {
              'overview.html','platform.html','development.html','evidence.html',
              'market.html','about.html','contact.html',
          }

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.assets=[]
              def handle_starttag(self, tag, attrs):
                  values=dict(attrs)
                  if tag=='a' and values.get('href'): self.links.append(values['href'])
                  if tag=='script' and values.get('src'): self.assets.append(values['src'])
                  if tag=='link' and values.get('href'): self.assets.append(values['href'])
                  if tag=='img' and values.get('src'): self.assets.append(values['src'])

          for name in pages:
              page=root/name
              assert page.is_file(), name
              html=page.read_text(encoding='utf-8')
              assert 'translate.google.com' not in html
              assert 'translate-cleanup' not in html
              audit=Audit(); audit.feed(html)
              nav={urlsplit(link).path for link in audit.links if urlsplit(link).path in expected_nav}
              assert nav==expected_nav, (name, nav)
              for asset in audit.assets:
                  if asset.startswith(('http://','https://','data:')): continue
                  target=urlsplit(asset).path
                  assert not target or (root/target).exists(), (name, asset)

          runtime=(root/'language.js').read_text(encoding='utf-8')
          for token in ('translate.google.com','TranslateElement','goog-te-combo','applyGoogleLanguage','loadGoogleTranslate'):
              assert token not in runtime, token
          for token in ('loadDictionary','applyDictionary','translations/generated','clearLegacyGoogleState'):
              assert token in runtime, token

          keys=None
          report=json.loads((root/'translations/generated/report.json').read_text(encoding='utf-8'))
          for locale in ('zh-CN','ja','fr','de','es'):
              payload=json.loads((root/f'translations/generated/{locale}.json').read_text(encoding='utf-8'))
              strings=payload['strings']
              assert payload['locale']==locale and payload['source']=='en'
              assert len(strings)==797, (locale,len(strings))
              assert report[locale]['failure_count']==0
              assert report[locale]['strings']==797
              assert strings['Overview']!='Overview'
              changed=sum(1 for key,value in strings.items() if value and value!=key)
              assert changed>=700, (locale,changed)
              if keys is None: keys=set(strings)
              else: assert set(strings)==keys, locale
          print('Translation repair branch validation passed.')
          PY
      - name: Record trusted validation result
        if: success()
        run: |
          cat > repair-validation.json <<EOF
          {
            "status": "success",
            "validated_commit": "${GITHUB_SHA}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "validated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          rm .github/workflows/validate-repair-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-validation.json .github/workflows/validate-repair-branch.yml
          git commit -m "Record successful translation repair validation"
          git push origin HEAD:agent/local-translations-no-google
