name: Generate local translations fast

on:
  push:
    branches: ["translation-generator-fast"]
    paths:
      - ".github/workflows/generate-local-translations-fast.yml"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline translation engine
        run: pip install --disable-pip-version-check argostranslate
      - name: Generate batched dictionaries
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from argostranslate import package, translate

          source = json.loads(Path('translation-source.json').read_text(encoding='utf-8'))
          strings = []
          seen = set()
          for item in source['unique']:
              text = item['text'].strip()
              if text and text not in seen:
                  seen.add(text)
                  strings.append(text)

          targets = {'zh-CN': 'zh', 'ja': 'ja', 'fr': 'fr', 'de': 'de', 'es': 'es'}
          protected = [
              'WinVerse™', 'SerotoniX™', 'UHN', 'KITE', 'NMES', 'fNMES', 'EEG',
              'Alessa Yang', 'Zen KOH', 'Professor Milos R. Popovic', 'Milos R. Popovic',
              'Shanghai', 'Toronto', 'Singapore', 'LinkedIn', 'US$', 'CAD', 'FDA', 'CE'
          ]

          def protect(text):
              values = {}
              out = text
              for index, token in enumerate(sorted(protected, key=len, reverse=True)):
                  if token in out:
                      marker = f'ZXQTERM{index}QXZ'
                      out = out.replace(token, marker)
                      values[marker] = token
              return out, values

          def restore(text, values):
              out = text
              for marker, token in values.items():
                  out = re.sub(re.escape(marker), token, out, flags=re.IGNORECASE)
              return out.strip()

          def should_copy(text):
              if re.fullmatch(r'[\d\W_]+', text, flags=re.UNICODE):
                  return True
              return text in protected

          def parse_batch(output, expected):
              pattern = re.compile(
                  r'ZXQITEM(\d{5})QXZ\s*(.*?)(?=ZXQITEM\d{5}QXZ|\Z)',
                  re.IGNORECASE | re.DOTALL,
              )
              parsed = {}
              for match in pattern.finditer(output):
                  parsed[int(match.group(1))] = match.group(2).strip()
              return {index: parsed.get(index) for index in expected}

          package.update_package_index()
          available = package.get_available_packages()
          out_dir = Path('translations/generated')
          out_dir.mkdir(parents=True, exist_ok=True)
          report = {}

          for locale, target in targets.items():
              matches = [p for p in available if p.from_code == 'en' and p.to_code == target]
              if not matches:
                  raise SystemExit(f'No Argos package for en -> {target}')
              package.install_from_path(matches[0].download())

              mapping = {text: text for text in strings if should_copy(text)}
              candidates = [(index, text, *protect(text)) for index, text in enumerate(strings) if not should_copy(text)]
              failures = []
              batch_size = 18

              for start in range(0, len(candidates), batch_size):
                  chunk = candidates[start:start + batch_size]
                  combined = '\n'.join(
                      f'ZXQITEM{index:05d}QXZ\n{prepared}'
                      for index, _text, prepared, _values in chunk
                  )
                  expected = [index for index, *_rest in chunk]
                  try:
                      translated_batch = translate.translate(combined, 'en', target)
                      parsed = parse_batch(translated_batch, expected)
                  except Exception:
                      parsed = {index: None for index in expected}

                  for index, text, prepared, values in chunk:
                      translated = parsed.get(index)
                      if not translated:
                          try:
                              translated = translate.translate(prepared, 'en', target)
                          except Exception as exc:
                              translated = text
                              failures.append({'text': text, 'error': str(exc)})
                      mapping[text] = restore(translated, values) or text

                  print(locale, min(start + batch_size, len(candidates)), '/', len(candidates), flush=True)

              payload = {
                  'locale': locale,
                  'source': 'en',
                  'generated_by': 'Argos Translate batched offline generation; terminology review remains required',
                  'strings': {text: mapping.get(text, text) for text in strings},
              }
              (out_dir / f'{locale}.json').write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              changed = sum(1 for key, value in payload['strings'].items() if value != key)
              report[locale] = {
                  'strings': len(payload['strings']),
                  'changed': changed,
                  'failure_count': len(failures),
                  'failures': failures[:20],
              }

          Path('translations/generated/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
      - name: Commit generated dictionaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/generated
          git commit -m "Generate batched local translation dictionaries" || true
          git push origin HEAD:translation-generator-fast
