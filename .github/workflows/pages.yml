name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate site files
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/winverse-mark.svg
          grep -q "SerotoniX" index.html
          grep -q "Evidence boundary" index.html
          grep -q "WinVerse" index.html

      - name: Inspect repaired SerotoniX source boards
        run: |
          set -u
          base="https://raw.githubusercontent.com/WinVerse-AI/Homepage/ab89cfad41b718eede7a884cf238df892759e777/assets"
          files=(
            serotonix-layered-architecture-2026.webp
            serotonix-controller-pcba-2026.webp
            serotonix-product-cad-2026.webp
            serotonix-product-dimensions-2026.webp
            serotonix-system-control-2026.webp
            serotonix-system-architecture-2026.webp
            serotonix-colour-finish-2026.webp
          )
          failed=0
          for index in "${!files[@]}"; do
            output="/tmp/${files[$index]}"
            url="${base}/${files[$index]}"
            echo "Checking ${url}"
            if ! curl --fail --show-error --location --retry 3 --output "$output" "$url"; then
              echo "DOWNLOAD FAILED: ${files[$index]}"
              failed=1
              continue
            fi
            bytes="$(wc -c < "$output")"
            kind="$(file -b "$output")"
            echo "Asset ${index}: ${bytes} bytes; ${kind}"
            if [ "$bytes" -le 50000 ] || ! grep -qi "Web/P image" <<< "$kind"; then
              echo "INVALID OR TRUNCATED: ${files[$index]}"
              failed=1
            fi
          done
          exit "$failed"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
