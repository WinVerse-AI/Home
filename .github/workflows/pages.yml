name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate site files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            styles.css
            visuals.css
            script.js
            assets/winverse-logo.webp
            assets/zen-koh.webp
            assets/serotonix-colourways.webp
            assets/serotonix-exploded.webp
            assets/serotonix-detail.webp
            i18n/en.js
            i18n/zh-CN.js
            i18n/ja.js
            i18n/fr.js
            i18n/de.js
            i18n/es.js
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing file: $file"; exit 1; }
          done

          node --check script.js
          for file in i18n/*.js; do node --check "$file"; done

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          required = {
              'assets/serotonix-colourways.webp',
              'assets/serotonix-exploded.webp',
              'assets/serotonix-detail.webp',
          }
          if 'visuals.css' not in html or not all(item in html for item in required):
              raise SystemExit('Approved attached visuals are not fully referenced.')
          if 'raw.githubusercontent.com' in html or 'WinVerse-AI/Homepage' in html:
              raise SystemExit('External SerotoniX image dependency found.')

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.add(values['id'])
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  if tag == 'img':
                      self.images.append(values)

          audit = Audit()
          audit.feed(html)
          broken = [href for href in audit.links if href.startswith('#') and href[1:] not in audit.ids]
          if broken:
              raise SystemExit(f'Broken internal links: {broken}')

          for image in audit.images:
              src = image.get('src', '')
              if not image.get('alt'):
                  raise SystemExit(f'Missing alt text: {src}')
              if src in required and image.get('loading') != 'lazy':
                  raise SystemExit(f'Product image must lazy-load: {src}')

          for path in required:
              data = Path(path).read_bytes()
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP: {path}')

          print('Site validation passed.')
          PY

  deploy:
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          page="${PAGE_URL%/}/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --retry 2 --output /tmp/live.html "$page" \
              && grep -q 'assets/serotonix-colourways.webp' /tmp/live.html \
              && grep -q 'assets/serotonix-exploded.webp' /tmp/live.html \
              && grep -q 'assets/serotonix-detail.webp' /tmp/live.html \
              && ! grep -q 'raw.githubusercontent.com' /tmp/live.html \
              && curl --fail --silent --show-error --location --output /dev/null "${page}assets/serotonix-colourways.webp" \
              && curl --fail --silent --show-error --location --output /dev/null "${page}assets/serotonix-exploded.webp" \
              && curl --fail --silent --show-error --location --output /dev/null "${page}assets/serotonix-detail.webp"; then
              echo "Verified attached-visual build at $page"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Publish deployment record
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          status_dir=/tmp/winverse-deployment-status
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch deployment-status "$repo" "$status_dir" 2>/dev/null; then
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          else
            git clone --depth 1 "$repo" "$status_dir" || exit 0
            git -C "$status_dir" checkout --orphan deployment-status
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          cat > "$status_dir/status.json" <<EOF
          {
            "status": "${DEPLOY_STATUS}",
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${PAGE_URL%/}/",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git -C "$status_dir" config user.name "github-actions[bot]"
          git -C "$status_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$status_dir" add .
          git -C "$status_dir" commit -m "Record WinVerse deployment ${GITHUB_SHA}" || true
          git -C "$status_dir" push origin HEAD:deployment-status || true
