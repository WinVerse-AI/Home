name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate multipage multilingual site
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            overview.html
            platform.html
            development.html
            evidence.html
            about.html
            contact.html
            styles.css
            visuals.css
            pages.css
            script.js
            assets/winverse-logo.webp
            assets/zen-koh.webp
            assets/serotonix-colourways.webp
            assets/serotonix-exploded.webp
            assets/serotonix-detail.webp
            i18n/en.js
            i18n/zh-CN.js
            i18n/ja.js
            i18n/fr.js
            i18n/de.js
            i18n/es.js
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing file: $file"; exit 1; }
          done

          node --check script.js
          for file in i18n/*.js; do node --check "$file"; done

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          pages = [
              Path('index.html'), Path('overview.html'), Path('platform.html'),
              Path('development.html'), Path('evidence.html'),
              Path('about.html'), Path('contact.html')
          ]
          expected_nav = {
              'overview.html','platform.html','development.html',
              'evidence.html','about.html','contact.html'
          }

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.images = []
                  self.scripts = []
                  self.styles = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  elif tag == 'img':
                      self.images.append(values)
                  elif tag == 'script' and values.get('src'):
                      self.scripts.append(values['src'])
                  elif tag == 'link' and values.get('href'):
                      self.styles.append(values['href'])

          for page in pages:
              html = page.read_text(encoding='utf-8')
              audit = Audit()
              audit.feed(html)

              local_nav = {href for href in audit.links if href in expected_nav}
              if local_nav != expected_nav:
                  raise SystemExit(f'{page}: incomplete page navigation: {local_nav}')

              for href in audit.links:
                  if href.startswith(('#','mailto:','tel:','http://','https://')):
                      continue
                  target = urlsplit(href).path
                  if target and not Path(target).exists():
                      raise SystemExit(f'{page}: broken link {href}')

              for asset in audit.scripts + audit.styles:
                  target = urlsplit(asset).path
                  if target and not Path(target).exists():
                      raise SystemExit(f'{page}: missing asset {asset}')

              for image in audit.images:
                  src = image.get('src','')
                  if not image.get('alt'):
                      raise SystemExit(f'{page}: missing alt text for {src}')
                  if src.startswith(('http://','https://')):
                      continue
                  if not Path(src).exists():
                      raise SystemExit(f'{page}: missing image {src}')

          for path in [
              Path('assets/winverse-logo.webp'), Path('assets/zen-koh.webp'),
              Path('assets/serotonix-colourways.webp'),
              Path('assets/serotonix-exploded.webp'),
              Path('assets/serotonix-detail.webp')
          ]:
              data = path.read_bytes()
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP: {path}')

          print('Validated seven pages, navigation, local assets and WebP payloads.')
          PY

  deploy:
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live multipage site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          pages=(index.html overview.html platform.html development.html evidence.html about.html contact.html)
          for attempt in {1..12}; do
            ready=true
            for page in "${pages[@]}"; do
              if ! curl --fail --silent --show-error --location --retry 2 --output "/tmp/${page}" "${base}${page}"; then
                ready=false
                break
              fi
            done
            if [ "$ready" = true ] \
              && grep -q 'overview.html' /tmp/index.html \
              && grep -q 'A venture built around disciplined claims' /tmp/overview.html \
              && grep -q 'One product system' /tmp/platform.html \
              && grep -q 'Progress is measured by resolved risk' /tmp/development.html \
              && grep -q 'Evidence must follow the exact product' /tmp/evidence.html \
              && grep -q 'A small team with explicit accountability' /tmp/about.html \
              && grep -q 'winverse.ai@gmail.com' /tmp/contact.html; then
              echo "Verified WinVerse multipage site at $base"
              exit 0
            fi
            echo "Live site not ready; attempt ${attempt}/12"
            sleep 10
          done
          exit 1

      - name: Publish deployment record
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          status_dir=/tmp/winverse-deployment-status
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch deployment-status "$repo" "$status_dir" 2>/dev/null; then
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          else
            git clone --depth 1 "$repo" "$status_dir" || exit 0
            git -C "$status_dir" checkout --orphan deployment-status
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          cat > "$status_dir/status.json" <<EOF
          {
            "status": "${DEPLOY_STATUS}",
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${PAGE_URL%/}/",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git -C "$status_dir" config user.name "github-actions[bot]"
          git -C "$status_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$status_dir" add .
          git -C "$status_dir" commit -m "Record WinVerse deployment ${GITHUB_SHA}" || true
          git -C "$status_dir" push origin HEAD:deployment-status || true
