name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate site files
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/winverse-mark.svg
          grep -q "SerotoniX" index.html
          grep -q "Evidence boundary" index.html
          grep -q "WinVerse" index.html

      - name: Verify all seven concept boards
        run: |
          set -euo pipefail
          urls=(
            "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-layered-architecture-2026.webp"
            "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-controller-pcba-2026.webp"
            "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-product-cad-2026.webp"
            "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-product-dimensions-2026.webp"
            "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-system-control-2026.webp"
            "https://raw.githubusercontent.com/WinVerse-AI/Homepage/841cb4697679edec2a83b9a21f74caa6ada787d9/assets/serotonix-system-architecture-2026.webp"
            "https://raw.githubusercontent.com/WinVerse-AI/Homepage/188646086300cad638d26fbfacde9b1b911b4cc5/assets/serotonix-colour-finish-2026.webp"
          )

          for index in "${!urls[@]}"; do
            output="/tmp/serotonix-${index}.webp"
            echo "Checking ${urls[$index]}"
            curl --fail --show-error --location --retry 3 \
              --output "$output" "${urls[$index]}"
            bytes="$(wc -c < "$output")"
            kind="$(file -b "$output")"
            echo "Asset ${index}: ${bytes} bytes; ${kind}"
            test "$bytes" -gt 50000
            grep -qi "Web/P image" <<< "$kind"
          done

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
