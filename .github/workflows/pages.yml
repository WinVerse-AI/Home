name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate website and media
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/winverse-logo.webp
          test -s assets/zen-koh.webp

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          required = ['WinVerse','SerotoniX','Evidence boundary','About Us','Alessa Yang','Zen KOH','Professor Milos R. Popovic','assets/winverse-logo.webp','assets/zen-koh.webp']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing required content: {missing}')

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.links=[]; self.images=[]
              def handle_starttag(self, tag, attrs):
                  values=dict(attrs)
                  if values.get('id'): self.ids.add(values['id'])
                  if tag=='a' and values.get('href'): self.links.append(values['href'])
                  if tag=='img': self.images.append(values)

          audit=Audit(); audit.feed(html)
          broken=[href for href in audit.links if href.startswith('#') and href[1:] not in audit.ids]
          if broken: raise SystemExit(f'Broken internal links: {broken}')
          expected={'assets/winverse-logo.webp','assets/zen-koh.webp','https://bme.utoronto.ca/wp-content/uploads/2023/07/Milos-Popovic-director-e1688497582502.png'}
          sources={image.get('src','') for image in audit.images}
          if sources != expected: raise SystemExit(f'Unexpected image sources: {sources}')
          for image in audit.images:
              if not image.get('alt'): raise SystemExit(f'Image missing alt text: {image}')
              if 'serotonix' in image.get('src','').lower(): raise SystemExit('Product imagery is not permitted.')
          if 'object-fit:fill' in css.replace(' ',''): raise SystemExit('Stretching images is not permitted.')
          if 'object-fit:contain' not in css.replace(' ',''): raise SystemExit('Proportional image containment is missing.')
          print(f'Validated {len(audit.links)} links, {len(audit.ids)} IDs and {len(audit.images)} images.')
          PY

          node --check script.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          page="${PAGE_URL%/}/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --retry 2 --output /tmp/winverse-live.html "$page" \
              && grep -q "About Us" /tmp/winverse-live.html \
              && grep -q "assets/winverse-logo.webp" /tmp/winverse-live.html \
              && grep -q "assets/zen-koh.webp" /tmp/winverse-live.html \
              && curl --fail --silent --show-error --location --output /dev/null "${page}assets/winverse-logo.webp" \
              && curl --fail --silent --show-error --location --output /dev/null "${page}assets/zen-koh.webp"; then
              echo "Verified WinVerse media and layout build at $page"
              exit 0
            fi
            echo "Live site not ready yet; attempt ${attempt}/12"
            sleep 10
          done
          exit 1

      - name: Publish deployment record
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          status_dir=/tmp/winverse-deployment-status
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch deployment-status "$repo" "$status_dir" 2>/dev/null; then
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          else
            git clone --depth 1 "$repo" "$status_dir" || exit 0
            git -C "$status_dir" checkout --orphan deployment-status
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          fi
          cat > "$status_dir/status.json" <<EOF
          {
            "status": "${DEPLOY_STATUS}",
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${PAGE_URL%/}/",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git -C "$status_dir" config user.name "github-actions[bot]"
          git -C "$status_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$status_dir" add .
          git -C "$status_dir" commit -m "Record WinVerse deployment ${GITHUB_SHA}" || true
          git -C "$status_dir" push origin HEAD:deployment-status || true
