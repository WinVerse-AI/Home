name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate image-free website
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js

          grep -q "WinVerse" index.html
          grep -q "SerotoniX" index.html
          grep -q "Evidence boundary" index.html
          grep -q "Neurotechnology built to earn confidence" index.html

          if grep -Eiq '<(img|picture|source|svg|video)([[:space:]>])' index.html; then
            echo "Image or media elements remain in index.html."
            exit 1
          fi

          if grep -Eiq '(og:image|raw\.githubusercontent\.com|background-image|url\([^)]*\.(png|jpe?g|webp|gif|svg))' index.html styles.css script.js; then
            echo "An image dependency remains in the published website files."
            exit 1
          fi

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class SiteAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.add(values['id'])
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])

          audit = SiteAudit()
          audit.feed(Path('index.html').read_text(encoding='utf-8'))
          missing = [href for href in audit.links if href.startswith('#') and href[1:] not in audit.ids]
          if missing:
              raise SystemExit(f'Broken internal links: {missing}')
          print(f'Validated {len(audit.links)} links and {len(audit.ids)} section IDs.')
          PY

          node --check script.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          page="${PAGE_URL%/}/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --retry 2 \
              --output /tmp/winverse-live.html "$page"; then
              if grep -q "Neurotechnology built to earn confidence" /tmp/winverse-live.html \
                && grep -q "SerotoniX" /tmp/winverse-live.html \
                && grep -q "Evidence boundary" /tmp/winverse-live.html \
                && ! grep -Eiq '<(img|picture|source|svg|video)([[:space:]>])' /tmp/winverse-live.html \
                && ! grep -Eiq '(og:image|raw\.githubusercontent\.com)' /tmp/winverse-live.html; then
                echo "Verified image-free WinVerse site at $page"
                exit 0
              fi
            fi
            echo "Live site not ready yet; attempt ${attempt}/12"
            sleep 10
          done
          echo "The deployed page did not pass the live-content check."
          exit 1

      - name: Publish deployment record
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          status_dir=/tmp/winverse-deployment-status
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch deployment-status "$repo" "$status_dir" 2>/dev/null; then
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          else
            git clone --depth 1 "$repo" "$status_dir" || exit 0
            git -C "$status_dir" checkout --orphan deployment-status
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          cat > "$status_dir/status.json" <<EOF
          {
            "status": "${DEPLOY_STATUS}",
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${PAGE_URL%/}/",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat > "$status_dir/README.md" <<EOF
          # WinVerse™ deployment status

          - Status: ${DEPLOY_STATUS}
          - Commit: \`${GITHUB_SHA}\`
          - Page: ${PAGE_URL%/}/
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Checked: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          git -C "$status_dir" config user.name "github-actions[bot]"
          git -C "$status_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$status_dir" add .
          git -C "$status_dir" commit -m "Record WinVerse deployment ${GITHUB_SHA}" || true
          git -C "$status_dir" push origin HEAD:deployment-status || true
