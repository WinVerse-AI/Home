name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate site
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html overview.html platform.html development.html
            evidence.html market.html about.html contact.html
            styles.css visuals.css pages.css evidence-review.css market.css
            typography.css leadership.css script.js build_site.py
            assets/winverse-logo.webp assets/zen-koh.webp
            assets/serotonix-colourways.webp assets/serotonix-exploded.webp
            assets/serotonix-detail.webp
            assets/alessa-yang-portrait-20260806.jpg
            i18n/en.js i18n/zh-CN.js i18n/ja.js
            i18n/fr.js i18n/de.js i18n/es.js
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing file: $file"; exit 1; }
          done

          node --check script.js
          for file in i18n/*.js; do node --check "$file"; done
          python3 -m py_compile build_site.py
          python3 build_site.py

          python3 <<'PY'
          import hashlib
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('dist')
          pages = [
              root / 'index.html', root / 'overview.html', root / 'platform.html',
              root / 'development.html', root / 'evidence.html', root / 'market.html',
              root / 'about.html', root / 'contact.html'
          ]
          expected_nav = {
              'overview.html', 'platform.html', 'development.html', 'evidence.html',
              'market.html', 'about.html', 'contact.html'
          }

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.images = []
                  self.scripts = []
                  self.styles = []
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.add(values['id'])
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  elif tag == 'img':
                      self.images.append(values)
                  elif tag == 'script' and values.get('src'):
                      self.scripts.append(values['src'])
                  elif tag == 'link' and values.get('href'):
                      self.styles.append(values['href'])

          for page in pages:
              html = page.read_text(encoding='utf-8')
              audit = Audit()
              audit.feed(html)
              local_nav = {href for href in audit.links if href in expected_nav}
              if local_nav != expected_nav:
                  raise SystemExit(f'{page.name}: incomplete navigation: {local_nav}')

              for href in audit.links:
                  if href.startswith('#'):
                      if href[1:] and href[1:] not in audit.ids:
                          raise SystemExit(f'{page.name}: broken anchor {href}')
                      continue
                  if href.startswith(('mailto:', 'tel:', 'http://', 'https://')):
                      continue
                  target = urlsplit(href).path
                  if target and not (root / target).exists():
                      raise SystemExit(f'{page.name}: broken local link {href}')

              for asset in audit.scripts + audit.styles:
                  target = urlsplit(asset).path
                  if target and not (root / target).exists():
                      raise SystemExit(f'{page.name}: missing asset {asset}')

              for image in audit.images:
                  src = image.get('src', '')
                  if not image.get('alt'):
                      raise SystemExit(f'{page.name}: missing alt text for {src}')
                  if src.startswith(('http://', 'https://')):
                      continue
                  if not (root / src).exists():
                      raise SystemExit(f'{page.name}: missing image {src}')

          portrait = root / 'assets/alessa-yang-portrait-20260806.jpg'
          data = portrait.read_bytes()
          expected_hash = '8aa919332c5a52f568ad33d9140010a6471c9f5745de0d4fe0ac40dba0d735fc'
          actual_hash = hashlib.sha256(data).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit(f'Alessa portrait checksum mismatch: {actual_hash}')
          if len(data) != 7305 or data[:3] != b'\xff\xd8\xff' or data[-2:] != b'\xff\xd9':
              raise SystemExit('Alessa portrait is not the verified JPEG payload.')

          leadership_css = (root / 'leadership.css').read_text(encoding='utf-8')
          for selector in ('.team-photo-alessa', '.team-photo-zen', '.team-photo-milos'):
              if selector not in leadership_css:
                  raise SystemExit(f'Missing leadership portrait rule: {selector}')

          for name in ('index.html', 'about.html'):
              html = (root / name).read_text(encoding='utf-8')
              if 'assets/alessa-yang-portrait-20260806.jpg' not in html:
                  raise SystemExit(f'{name}: verified Alessa portrait not injected.')
              if '>AY<' in html or 'Portrait placeholder' in html:
                  raise SystemExit(f'{name}: obsolete Alessa placeholder remains.')
              if 'team-photo-zen' not in html or 'team-photo-milos' not in html:
                  raise SystemExit(f'{name}: leadership portrait system incomplete.')

          print('Validated eight pages and exact Alessa portrait checksum.')
          PY

  deploy:
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production site
        run: python3 build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site and exact portrait bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          pages=(index.html about.html)

          for attempt in {1..12}; do
            ready=true
            for page in "${pages[@]}"; do
              if ! curl --fail --silent --show-error --location --retry 2 \
                --output "/tmp/${page}" "${base}${page}"; then
                ready=false
                break
              fi
            done

            if [ "$ready" = true ] \
              && curl --fail --silent --show-error --location --retry 2 \
                --output /tmp/alessa-yang.jpg \
                "${base}assets/alessa-yang-portrait-20260806.jpg" \
              && curl --fail --silent --show-error --location --retry 2 \
                --output /tmp/leadership.css "${base}leadership.css"; then
              if python3 - <<'PY'
          import hashlib
          from pathlib import Path

          data = Path('/tmp/alessa-yang.jpg').read_bytes()
          expected_hash = '8aa919332c5a52f568ad33d9140010a6471c9f5745de0d4fe0ac40dba0d735fc'
          assert hashlib.sha256(data).hexdigest() == expected_hash
          assert len(data) == 7305
          assert data[:3] == b'\xff\xd8\xff'
          assert data[-2:] == b'\xff\xd9'

          css = Path('/tmp/leadership.css').read_text(encoding='utf-8')
          assert '.team-photo-alessa' in css
          assert 'object-fit: cover' in css

          for page in ('/tmp/index.html', '/tmp/about.html'):
              html = Path(page).read_text(encoding='utf-8')
              assert 'assets/alessa-yang-portrait-20260806.jpg' in html
              assert '>AY<' not in html
              assert 'Portrait placeholder' not in html
          PY
              then
                echo "Verified live Alessa portrait at $base"
                exit 0
              fi
            fi

            echo "Live site not ready; attempt ${attempt}/12"
            sleep 10
          done

          echo "Live Alessa portrait verification failed."
          exit 1

      - name: Publish deployment record
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          status_dir=/tmp/winverse-deployment-status
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch deployment-status "$repo" "$status_dir" 2>/dev/null; then
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          else
            git clone --depth 1 "$repo" "$status_dir" || exit 0
            git -C "$status_dir" checkout --orphan deployment-status
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          cat > "$status_dir/status.json" <<EOF
          {
            "status": "${DEPLOY_STATUS}",
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${PAGE_URL%/}/",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git -C "$status_dir" config user.name "github-actions[bot]"
          git -C "$status_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$status_dir" add .
          git -C "$status_dir" commit -m "Record WinVerse deployment ${GITHUB_SHA}" || true
          git -C "$status_dir" push origin HEAD:deployment-status || true
