name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate sources and build site
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html overview.html platform.html development.html
            evidence.html market.html about.html contact.html
            commercial-beachhead.html differentiation.html expansion-engine.html
            styles.css typography.css leadership.css layout-polish.css
            pillar-visuals.css pillar-image-beauty.css
            pillar-image-affective.css pillar-image-research.css
            language.css script.js language.js build_site.py
            translations/generated/zh-CN.json translations/generated/ja.json
            translations/generated/fr.json translations/generated/de.json
            translations/generated/es.json translations/generated/report.json
            assets/winverse-logo.webp assets/zen-koh.webp
            assets/serotonix-colourways.webp assets/serotonix-exploded.webp
            assets/serotonix-detail.webp assets/alessa-yang-portrait-20260806.jpg
            assets/flags/gb.svg assets/flags/cn.svg assets/flags/jp.svg
            assets/flags/fr.svg assets/flags/de.svg assets/flags/es.svg
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing file: $file"; exit 1; }
          done

          test ! -e translate-cleanup.js
          test ! -e translate-cleanup.css

          node --check script.js
          node --check language.js
          python3 -m py_compile build_site.py
          python3 build_site.py

          cat > dist/version.json <<EOF
          {"commit_sha":"${GITHUB_SHA}","run_id":"${GITHUB_RUN_ID}"}
          EOF

          python3 <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('dist')
          page_names = (
              'index.html', 'overview.html', 'platform.html', 'development.html',
              'evidence.html', 'market.html', 'about.html', 'contact.html',
              'commercial-beachhead.html', 'differentiation.html',
              'expansion-engine.html',
          )
          expected_nav = {
              'overview.html', 'platform.html', 'development.html', 'evidence.html',
              'market.html', 'about.html', 'contact.html',
          }

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.images = []
                  self.scripts = []
                  self.styles = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  elif tag == 'img':
                      self.images.append(values)
                  elif tag == 'script' and values.get('src'):
                      self.scripts.append(values['src'])
                  elif tag == 'link' and values.get('href'):
                      self.styles.append(values['href'])

          for name in page_names:
              page = root / name
              if not page.is_file():
                  raise SystemExit(f'Missing built page: {name}')
              html = page.read_text(encoding='utf-8')
              if 'translate-cleanup' in html or 'translate.google.com' in html:
                  raise SystemExit(f'{name}: obsolete Google translation asset remains')

              audit = Audit()
              audit.feed(html)
              nav = {urlsplit(href).path for href in audit.links if urlsplit(href).path in expected_nav}
              if nav != expected_nav:
                  raise SystemExit(f'{name}: incomplete navigation: {nav}')

              styles = {urlsplit(item).path for item in audit.styles}
              scripts = {urlsplit(item).path for item in audit.scripts}
              for required in ('layout-polish.css', 'language.css'):
                  if required not in styles:
                      raise SystemExit(f'{name}: missing {required}')
              for required in ('script.js', 'language.js'):
                  if required not in scripts:
                      raise SystemExit(f'{name}: missing {required}')

              for href in audit.links:
                  if href.startswith(('#', 'mailto:', 'tel:', 'http://', 'https://')):
                      continue
                  target = urlsplit(href).path
                  if target and not (root / target).exists():
                      raise SystemExit(f'{name}: broken link {href}')

              for asset in audit.styles + audit.scripts:
                  target = urlsplit(asset).path
                  if target and not (root / target).exists():
                      raise SystemExit(f'{name}: missing asset {asset}')

              for image in audit.images:
                  src = image.get('src', '')
                  if not image.get('alt'):
                      raise SystemExit(f'{name}: missing alt text for {src}')
                  if not src.startswith(('http://', 'https://')) and not (root / src).exists():
                      raise SystemExit(f'{name}: missing image {src}')

          for flag in ('gb.svg', 'cn.svg', 'jp.svg', 'fr.svg', 'de.svg', 'es.svg'):
              ET.parse(root / 'assets' / 'flags' / flag)

          runtime = (root / 'language.js').read_text(encoding='utf-8')
          for forbidden in (
              'translate.google.com', 'TranslateElement', 'google_translate_element',
              'goog-te-combo', 'applyGoogleLanguage', 'loadGoogleTranslate',
          ):
              if forbidden in runtime:
                  raise SystemExit(f'Google translation runtime remains: {forbidden}')
          for required in (
              'translations/generated', 'loadDictionary', 'applyDictionary',
              'clearLegacyGoogleState', 'localStorage',
          ):
              if required not in runtime:
                  raise SystemExit(f'Local translation runtime missing: {required}')

          locales = ('zh-CN', 'ja', 'fr', 'de', 'es')
          key_set = None
          for locale in locales:
              path = root / 'translations' / 'generated' / f'{locale}.json'
              payload = json.loads(path.read_text(encoding='utf-8'))
              if payload.get('locale') != locale or payload.get('source') != 'en':
                  raise SystemExit(f'{locale}: invalid dictionary metadata')
              strings = payload.get('strings')
              if not isinstance(strings, dict) or len(strings) < 300:
                  raise SystemExit(f'{locale}: incomplete dictionary ({len(strings or {})})')
              current_keys = set(strings)
              if key_set is None:
                  key_set = current_keys
              elif current_keys != key_set:
                  raise SystemExit(f'{locale}: dictionary key set differs')
              changed = sum(1 for key, value in strings.items() if value and value != key)
              if changed < len(strings) * 0.45:
                  raise SystemExit(f'{locale}: too few translated strings ({changed}/{len(strings)})')
              if strings.get('Overview') in (None, '', 'Overview'):
                  raise SystemExit(f'{locale}: navigation translation smoke test failed')

          print('Validated eleven pages and five complete local translation dictionaries.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Submit deployment and verify the public commit
        id: deployment
        uses: actions/github-script@v8
        timeout-minutes: 45
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const liveBase = 'https://winverse-ai.github.io/Home/';
            const terminalSuccess = new Set([
              'succeed', 'success', 'built', 'deployed',
              'deployment_success', 'deployment_completed'
            ]);
            const terminalFailure = new Set([
              'failed', 'failure', 'error', 'errored', 'cancelled', 'canceled',
              'deployment_failed', 'deployment_cancelled', 'deployment_canceled'
            ]);

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId, per_page: 100 }
            );
            const artifact = artifacts
              .filter((item) => item.name === 'github-pages' && !item.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!artifact) {
              throw new Error('The github-pages artifact was not found for this workflow run.');
            }

            const staleDeployments = [
              'f33dfb30420b946d54d92e94e54b11494b1fd2f4',
              '0bb23fb49319ed03486f49da20b927cfa8297b08',
              '9a67cec35b7d0df9203a5c766cbdea97b1235488',
              'dfdaa51a5bd2b9e962dfee72487bfca60779afc8'
            ];
            for (const deploymentId of staleDeployments) {
              try {
                const current = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                  { owner, repo, pages_deployment_id: deploymentId }
                );
                const status = String(current.data.status || '').toLowerCase();
                if (!terminalSuccess.has(status) && !terminalFailure.has(status)) {
                  await github.request(
                    'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                    { owner, repo, pages_deployment_id: deploymentId }
                  );
                  core.info(`Cancelled stale Pages deployment ${deploymentId}.`);
                }
              } catch (error) {
                if (![404, 409, 422].includes(error.status)) throw error;
                core.info(`Stale deployment ${deploymentId} is already clear (${error.status}).`);
              }
            }

            const oidcToken = await core.getIDToken();
            const created = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner,
                repo,
                artifact_id: artifact.id,
                environment: 'github-pages',
                pages_build_version: context.sha,
                oidc_token: oidcToken
              }
            );

            const deploymentId = created.data.id || context.sha;
            const rawPageUrl = created.data.page_url || liveBase;
            const pageUrl = rawPageUrl.startsWith('http') ? rawPageUrl : `https://${rawPageUrl}`;
            core.setOutput('deployment_id', deploymentId);
            core.setOutput('page_url', pageUrl.endsWith('/') ? pageUrl : `${pageUrl}/`);
            core.info(`Submitted Pages deployment ${deploymentId} with artifact ${artifact.id}.`);

            const deadline = Date.now() + 42 * 60 * 1000;
            while (Date.now() < deadline) {
              try {
                const response = await fetch(`${liveBase}version.json?run=${context.runId}&t=${Date.now()}`, {
                  headers: { 'cache-control': 'no-cache' }
                });
                if (response.ok) {
                  const version = await response.json();
                  core.info(`Public commit: ${version.commit_sha || 'unknown'}`);
                  if (version.commit_sha === context.sha) {
                    core.setOutput('status', 'live_verified');
                    return;
                  }
                }
              } catch (error) {
                core.info(`Public version check is not ready: ${error.message}`);
              }

              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                  { owner, repo, pages_deployment_id: deploymentId }
                );
                const status = String(response.data.status || '').toLowerCase();
                core.info(`Pages deployment status: ${status || 'unknown'}`);
                if (terminalFailure.has(status)) {
                  throw new Error(`Pages deployment ended with status: ${status}`);
                }
              } catch (error) {
                if (error.message?.startsWith('Pages deployment ended')) throw error;
                if (![404, 409, 422].includes(error.status)) throw error;
                core.info(`Pages deployment status is temporarily unavailable (${error.status}).`);
              }

              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            throw new Error(
              `The public site did not reach commit ${context.sha} within 42 minutes. ` +
              `Deployment ${deploymentId} was left available for diagnosis.`
            );

      - name: Verify local translations on the public site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL:-https://winverse-ai.github.io/Home/}"
          base="${base%/}/"
          cache="?verify=${GITHUB_RUN_ID}"

          curl --fail --silent --show-error --location --output /tmp/version.json "${base}version.json${cache}"
          deployed_sha="$(python3 -c 'import json; print(json.load(open("/tmp/version.json"))["commit_sha"])')"
          test "$deployed_sha" = "$EXPECTED_SHA"

          curl --fail --silent --show-error --location --output /tmp/index.html "${base}index.html${cache}"
          curl --fail --silent --show-error --location --output /tmp/language.js "${base}language.js${cache}"
          grep -q 'language.js' /tmp/index.html
          grep -q 'language.css' /tmp/index.html
          ! grep -q 'translate-cleanup' /tmp/index.html
          ! grep -q 'translate.google.com' /tmp/language.js
          ! grep -q 'TranslateElement' /tmp/language.js
          grep -q 'translations/generated' /tmp/language.js

          mkdir -p /tmp/translations
          for locale in zh-CN ja fr de es; do
            curl --fail --silent --show-error --location \
              --output "/tmp/translations/${locale}.json" \
              "${base}translations/generated/${locale}.json${cache}"
          done

          python3 <<'PY'
          import json
          from pathlib import Path
          for locale in ('zh-CN', 'ja', 'fr', 'de', 'es'):
              payload = json.loads((Path('/tmp/translations') / f'{locale}.json').read_text(encoding='utf-8'))
              assert payload['locale'] == locale
              assert len(payload['strings']) >= 300
              assert payload['strings']['Overview'] != 'Overview'
          PY
          echo "Verified local multilingual build $EXPECTED_SHA at $base"

      - name: Publish deployment record
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          status_dir=/tmp/winverse-deployment-status
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          page_url="${PAGE_URL:-https://winverse-ai.github.io/Home/}"

          if git clone --depth 1 --branch deployment-status "$repo" "$status_dir" 2>/dev/null; then
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          else
            git clone --depth 1 "$repo" "$status_dir" || exit 0
            git -C "$status_dir" checkout --orphan deployment-status
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          cat > "$status_dir/status.json" <<EOF
          {
            "status": "${DEPLOY_STATUS}",
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${page_url%/}/",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git -C "$status_dir" config user.name "github-actions[bot]"
          git -C "$status_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$status_dir" add .
          git -C "$status_dir" commit -m "Record WinVerse deployment ${GITHUB_SHA}" || true
          git -C "$status_dir" push origin HEAD:deployment-status || true
