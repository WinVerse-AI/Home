name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate site
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html overview.html platform.html development.html
            evidence.html market.html about.html contact.html
            commercial-beachhead.html differentiation.html expansion-engine.html
            styles.css visuals.css pages.css evidence-review.css market.css
            typography.css leadership.css pillar-visuals.css layout-polish.css
            pillar-image-beauty.css pillar-image-affective.css pillar-image-research.css
            language.css script.js language.js build_site.py
            assets/winverse-logo.webp assets/zen-koh.webp
            assets/serotonix-colourways.webp assets/serotonix-exploded.webp
            assets/serotonix-detail.webp assets/alessa-yang-portrait-20260806.jpg
            assets/flags/gb.svg assets/flags/cn.svg assets/flags/jp.svg
            assets/flags/fr.svg assets/flags/de.svg assets/flags/es.svg
            i18n/en.js i18n/zh-CN.js i18n/ja.js
            i18n/fr.js i18n/de.js i18n/es.js
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing file: $file"; exit 1; }
          done

          node --check script.js
          node --check language.js
          for file in i18n/*.js; do node --check "$file"; done
          python3 -m py_compile build_site.py
          python3 build_site.py

          python3 <<'PY'
          import base64
          import hashlib
          import re
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('dist')
          page_names = (
              'index.html', 'overview.html', 'platform.html', 'development.html',
              'evidence.html', 'market.html', 'about.html', 'contact.html',
              'commercial-beachhead.html', 'differentiation.html',
              'expansion-engine.html',
          )
          pages = [root / name for name in page_names]
          expected_nav = {
              'overview.html', 'platform.html', 'development.html', 'evidence.html',
              'market.html', 'about.html', 'contact.html',
          }
          global_styles = {
              'typography.css', 'leadership.css', 'layout-polish.css',
              'pillar-image-beauty.css', 'pillar-image-affective.css',
              'pillar-image-research.css', 'language.css',
          }
          required_scripts = {'script.js', 'language.js'}

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.images = []
                  self.scripts = []
                  self.styles = []
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.add(values['id'])
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  elif tag == 'img':
                      self.images.append(values)
                  elif tag == 'script' and values.get('src'):
                      self.scripts.append(values['src'])
                  elif tag == 'link' and values.get('href'):
                      self.styles.append(values['href'])

          for page in pages:
              if not page.is_file():
                  raise SystemExit(f'Missing built page: {page.name}')
              html = page.read_text(encoding='utf-8')
              audit = Audit()
              audit.feed(html)

              local_nav = {href for href in audit.links if href in expected_nav}
              if local_nav != expected_nav:
                  raise SystemExit(f'{page.name}: incomplete navigation: {local_nav}')

              present_styles = {urlsplit(href).path for href in audit.styles}
              missing_styles = global_styles - present_styles
              if missing_styles:
                  raise SystemExit(f'{page.name}: missing global styles: {missing_styles}')

              present_scripts = {urlsplit(src).path for src in audit.scripts}
              missing_scripts = required_scripts - present_scripts
              if missing_scripts:
                  raise SystemExit(f'{page.name}: missing scripts: {missing_scripts}')

              for href in audit.links:
                  if href.startswith('#'):
                      if href[1:] and href[1:] not in audit.ids:
                          raise SystemExit(f'{page.name}: broken anchor {href}')
                      continue
                  if href.startswith(('mailto:', 'tel:', 'http://', 'https://')):
                      continue
                  target = urlsplit(href).path
                  if target and not (root / target).exists():
                      raise SystemExit(f'{page.name}: broken local link {href}')

              for asset in audit.scripts + audit.styles:
                  target = urlsplit(asset).path
                  if target and not (root / target).exists():
                      raise SystemExit(f'{page.name}: missing asset {asset}')

              for image in audit.images:
                  src = image.get('src', '')
                  if not image.get('alt'):
                      raise SystemExit(f'{page.name}: missing alt text for {src}')
                  if src.startswith(('http://', 'https://')):
                      continue
                  if not (root / src).exists():
                      raise SystemExit(f'{page.name}: missing image {src}')

          language_js = (root / 'language.js').read_text(encoding='utf-8')
          language_css = (root / 'language.css').read_text(encoding='utf-8')
          expected_languages = {
              'en': 'assets/flags/gb.svg',
              'zh-CN': 'assets/flags/cn.svg',
              'ja': 'assets/flags/jp.svg',
              'fr': 'assets/flags/fr.svg',
              'de': 'assets/flags/de.svg',
              'es': 'assets/flags/es.svg',
          }
          for code, flag in expected_languages.items():
              if code not in language_js or flag not in language_js:
                  raise SystemExit(f'Language runtime missing {code} / {flag}')
              flag_path = root / flag
              ET.parse(flag_path)
              svg = flag_path.read_text(encoding='utf-8')
              if '<svg' not in svg or 'viewBox="0 0 36 24"' not in svg:
                  raise SystemExit(f'Invalid flag icon: {flag}')

          for token in (
              'language-picker', 'language-menu', 'language-option',
              'translation-engine', 'prefers-reduced-motion',
          ):
              if token not in language_css:
                  raise SystemExit(f'Language stylesheet missing: {token}')

          if 'translate.google.com/translate_a/element.js' not in language_js:
              raise SystemExit('Automated translation service loader missing')
          if "localStorage.setItem(STORAGE_KEY" not in language_js:
              raise SystemExit('Persistent language selection missing')

          pillar_expectations = {
              'commercial-beachhead.html': ('pillar-image-beauty', 'Premium beauty technology'),
              'differentiation.html': ('pillar-image-affective', 'Momentary affective experience'),
              'expansion-engine.html': ('pillar-image-research', 'Claim-specific research'),
          }
          for name, (image_class, heading) in pillar_expectations.items():
              html = (root / name).read_text(encoding='utf-8')
              if image_class not in html or heading not in html:
                  raise SystemExit(f'{name}: pillar hero content is incomplete')

          for css_name in (
              'pillar-image-beauty.css',
              'pillar-image-affective.css',
              'pillar-image-research.css',
          ):
              text = (root / css_name).read_text(encoding='utf-8')
              match = re.search(r'data:image/avif;base64,([^"\)]+)', text)
              if not match:
                  raise SystemExit(f'{css_name}: embedded AVIF payload missing')
              data = base64.b64decode(match.group(1), validate=True)
              if len(data) < 8000 or data[4:8] != b'ftyp' or b'avif' not in data[:24]:
                  raise SystemExit(f'{css_name}: invalid or undersized AVIF payload')

          if (root / 'asset-sources').exists() or (root / 'asset-sources-v3').exists():
              raise SystemExit('Working image-source directories leaked into Pages artifact')

          portrait = root / 'assets/alessa-yang-portrait-20260806.jpg'
          data = portrait.read_bytes()
          expected_hash = '8aa919332c5a52f568ad33d9140010a6471c9f5745de0d4fe0ac40dba0d735fc'
          if hashlib.sha256(data).hexdigest() != expected_hash:
              raise SystemExit('Alessa portrait checksum mismatch')

          print('Validated eleven pages, six language options and three embedded AVIF visuals.')
          PY

  deploy:
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production site
        run: python3 build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site and language controls
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          pages=(
            index.html overview.html platform.html development.html
            evidence.html market.html about.html contact.html
            commercial-beachhead.html differentiation.html expansion-engine.html
          )
          styles=(
            layout-polish.css pillar-image-beauty.css
            pillar-image-affective.css pillar-image-research.css language.css
          )
          scripts=(script.js language.js)
          flags=(gb.svg cn.svg jp.svg fr.svg de.svg es.svg)

          for attempt in {1..15}; do
            ready=true
            rm -rf /tmp/winverse-live
            mkdir -p /tmp/winverse-live/flags

            for page in "${pages[@]}"; do
              if ! curl --fail --silent --show-error --location --retry 2 \
                --output "/tmp/winverse-live/${page}" "${base}${page}"; then
                ready=false
                break
              fi
            done

            if [ "$ready" = true ]; then
              for style in "${styles[@]}"; do
                curl --fail --silent --show-error --location --retry 2 \
                  --output "/tmp/winverse-live/${style}" "${base}${style}" || { ready=false; break; }
              done
            fi

            if [ "$ready" = true ]; then
              for script in "${scripts[@]}"; do
                curl --fail --silent --show-error --location --retry 2 \
                  --output "/tmp/winverse-live/${script}" "${base}${script}" || { ready=false; break; }
              done
            fi

            if [ "$ready" = true ]; then
              for flag in "${flags[@]}"; do
                curl --fail --silent --show-error --location --retry 2 \
                  --output "/tmp/winverse-live/flags/${flag}" "${base}assets/flags/${flag}" || { ready=false; break; }
              done
            fi

            if [ "$ready" = true ] && python3 - <<'PY'
          import base64
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('/tmp/winverse-live')
          for page_name in (
              'index.html', 'overview.html', 'platform.html', 'development.html',
              'evidence.html', 'market.html', 'about.html', 'contact.html',
              'commercial-beachhead.html', 'differentiation.html',
              'expansion-engine.html',
          ):
              html = (root / page_name).read_text(encoding='utf-8')
              assert 'language.css' in html
              assert 'language.js' in html

          language_js = (root / 'language.js').read_text(encoding='utf-8')
          for code in ('en', 'zh-CN', 'ja', 'fr', 'de', 'es'):
              assert code in language_js
          assert 'translate.google.com/translate_a/element.js' in language_js

          for flag in ('gb.svg', 'cn.svg', 'jp.svg', 'fr.svg', 'de.svg', 'es.svg'):
              ET.parse(root / 'flags' / flag)

          pillars = {
              'commercial-beachhead.html': 'pillar-image-beauty.css',
              'differentiation.html': 'pillar-image-affective.css',
              'expansion-engine.html': 'pillar-image-research.css',
          }
          for page_name, css_name in pillars.items():
              html = (root / page_name).read_text(encoding='utf-8')
              assert css_name in html
              text = (root / css_name).read_text(encoding='utf-8')
              match = re.search(r'data:image/avif;base64,([^"\)]+)', text)
              assert match
              data = base64.b64decode(match.group(1), validate=True)
              assert len(data) >= 8000
              assert data[4:8] == b'ftyp'
              assert b'avif' in data[:24]
          PY
            then
              echo "Verified live WinVerse language controls at $base"
              exit 0
            fi

            echo "Live site not ready; attempt ${attempt}/15"
            sleep 10
          done

          echo "Live WinVerse language verification failed."
          exit 1

      - name: Publish deployment record
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          status_dir=/tmp/winverse-deployment-status
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch deployment-status "$repo" "$status_dir" 2>/dev/null; then
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          else
            git clone --depth 1 "$repo" "$status_dir" || exit 0
            git -C "$status_dir" checkout --orphan deployment-status
            git -C "$status_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          cat > "$status_dir/status.json" <<EOF
          {
            "status": "${DEPLOY_STATUS}",
            "commit_sha": "${GITHUB_SHA}",
            "page_url": "${PAGE_URL%/}/",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git -C "$status_dir" config user.name "github-actions[bot]"
          git -C "$status_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$status_dir" add .
          git -C "$status_dir" commit -m "Record WinVerse deployment ${GITHUB_SHA}" || true
          git -C "$status_dir" push origin HEAD:deployment-status || true
