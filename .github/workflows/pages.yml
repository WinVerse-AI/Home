name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate image-free multilingual website
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            index.html
            styles.css
            script.js
            assets/winverse-logo.webp
            assets/zen-koh.webp
            i18n/en.js
            i18n/zh-CN.js
            i18n/ja.js
            i18n/fr.js
            i18n/de.js
            i18n/es.js
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty file: $file"; exit 1; }
          done

          node --check script.js
          for file in i18n/*.js; do node --check "$file"; done

          if grep -Eiq 'visuals\.css|principle-media|raw\.githubusercontent\.com/WinVerse-AI/Homepage|serotonix-[^" ]+\.(png|jpe?g|webp|gif|svg)' index.html; then
            echo "Incorrect SerotoniX product visuals remain in index.html."
            exit 1
          fi

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.add(values['id'])
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  if tag == 'img':
                      self.images.append(values)

          audit = Audit()
          audit.feed(html)
          broken = [href for href in audit.links if href.startswith('#') and href[1:] not in audit.ids]
          if broken:
              raise SystemExit(f'Broken internal links: {broken}')

          expected = {
              'assets/winverse-logo.webp',
              'assets/zen-koh.webp',
              'https://bme.utoronto.ca/wp-content/uploads/2023/07/Milos-Popovic-director-e1688497582502.png',
          }
          sources = {image.get('src', '') for image in audit.images}
          if sources != expected:
              raise SystemExit(f'Unexpected image sources: {sources}')

          for image in audit.images:
              if not image.get('alt'):
                  raise SystemExit(f'Image missing alt text: {image}')

          print(f'Validated {len(audit.links)} links and {len(audit.images)} approved images.')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live image-free deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          page="${PAGE_URL%/}/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --retry 2 --output /tmp/winverse-live.html "$page" \
              && grep -q "About Us" /tmp/winverse-live.html \
              && ! grep -Eiq 'visuals\.css|principle-media|raw\.githubusercontent\.com/WinVerse-AI/Homepage|serotonix-[^" ]+\.(png|jpe?g|webp|gif|svg)' /tmp/winverse-live.html; then
              echo "Verified image-free WinVerse build at $page"
              exit 0
            fi
            echo "Live site not ready; attempt ${attempt}/12"
            sleep 10
          done
          exit 1
